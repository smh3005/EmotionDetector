
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>

    <form action="/emotionDetector" method="get">
        <label for="textToAnalyze">Enter text to analyze:</label>
        <input
            type="text"
            id="textToAnalyze"
            name="textToAnalyze"
        >
        <button type="submit">Analyze Emotion</button>
    </form>

    {% if result %}
        <h2>Emotion Results</h2>
        <p>Anger: {{ result.anger }}</p>
        <p>Disgust: {{ result.disgust }}</p>
        <p>Fear: {{ result.fear }}</p>
        <p>Joy: {{ result.joy }}</p>
        <p>Sadness: {{ result.sadness }}</p>
        <p>Dominant emotion: {{ result.dominant_emotion }}</p>
    {% endif %}

    {% if error %}
        <p id="error">{{ error }}</p>
    {% endif %}
</body>
</html>
